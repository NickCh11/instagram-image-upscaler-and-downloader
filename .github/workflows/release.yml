name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the extension package
        run: npm run package

      - name: Validate the package
        run: npm run lint

      - name: Create Firefox XPI copy
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "outputs/instagram_image_upscaler_and_downloader-${version}.zip" \
            "outputs/instagram_image_upscaler_and_downloader-${version}.xpi"

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instagram-image-upscaler-and-downloader-${{ github.ref_name }}
          path: |
            outputs/*.xpi
            outputs/*.zip

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" outputs/*.xpi outputs/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" outputs/*.xpi outputs/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
